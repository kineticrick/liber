[project]
name = "liber"
version = "0.1.0"
description = "A personal knowledge base about you, readable by any LLM or agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "python-frontmatter>=1.1",
    "markitdown[pdf,docx]>=0.1.2",
    "fastmcp==4.0.10",
    "httpx>=0.28",
]

[project.optional-dependencies]
voice = ["openai[realtime]==3.23.0", "anthropic==1.11.0"]

[project.scripts]
liber = "liber.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/liber"]

[dependency-groups]
dev = ["pytest>=8", "python-docx>=1.1", "openai[realtime]==3.23.0", "anthropic==1.11.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: makes real paid API calls; run with `uv run pytest -m live`"]
addopts = "-m 'not live'"
